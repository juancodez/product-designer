<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Juan Gomez Vara</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/LogoJGV_favicon-32px.svg" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 60px 80px;
      position: relative;
    }
    .error-text { max-width: 640px; margin: 0 auto; }
    @media (max-width: 860px) {
      .error-hero { padding: 90px 24px 40px; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo" aria-label="Juan Gomez Vara">
      <img class="logo-img" src="assets/logo-dark.svg" alt="JGV" width="44" height="44" />
      <span class="nav-name">Juan Gomez Vara</span>
    </a>
    <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html#work" class="nav-link magnetic"><span>Projects</span></a>
        <a href="index.html#about" class="nav-link magnetic"><span>About</span></a>
      </div>
      <a href="index.html#footer" class="btn-nav magnetic">
        <span class="btn-text">Contact</span>
        <span class="btn-arrow">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>
  </nav>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <nav class="mobile-menu-links">
      <a href="index.html#work" class="mobile-nav-link">Projects</a>
      <a href="index.html#about" class="mobile-nav-link">About</a>
      <a href="index.html#footer" class="mobile-nav-link">Contact</a>
    </nav>
  </div>

  <section class="hero error-hero" id="hero">
    <canvas class="dot-grid-canvas" id="dotGrid"></canvas>
    <div class="hero-noise"></div>

    <div class="hero-content error-text">
      <h1 class="hero-title">
        <div class="hero-line" data-animate="reveal" data-delay="100">
          <span>No connection</span>
        </div>
        <div class="hero-line" data-animate="reveal" data-delay="250">
          <span>right <span class="gradient-word">now.</span></span>
        </div>
      </h1>

      <p class="hero-sub" data-animate="fade-up" data-delay="450">
        <span id="offlineTypewriter"></span><span class="type-cursor" id="offlineTypeCursor"></span>
      </p>

      <div data-animate="fade-up" data-delay="600" style="margin-top:2rem;">
        <a href="index.html" class="btn-primary magnetic" onclick="location.reload(); return false;">
          <span class="btn-text">Try again</span>
          <span class="btn-arrow">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 13L13 3M13 3H7M13 3v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    window.addEventListener('load', () => {
      const typeEl     = document.getElementById('offlineTypewriter');
      const typeCursor = document.getElementById('offlineTypeCursor');
      if (!typeEl) return;
      const fullText = 'You\'re offline. Check your connection and try again.';
      let idx = 0;
      function typeNext() {
        if (idx >= fullText.length) { typeCursor.classList.add('done'); return; }
        typeEl.textContent += fullText[idx++];
        setTimeout(typeNext, 26 + Math.random() * 20);
      }
      setTimeout(typeNext, 1450);
    });
  </script>

</body>
</html>
