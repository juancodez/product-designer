<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Juan Gomez Vara</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/LogoJGV_favicon-32px.svg" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400,300&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 120px 60px 80px;
      position: relative;
    }
    .error-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: start;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .error-text {
      padding-top: 20px;
    }
    .error-video-wrap {
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 9 / 16;
      max-height: 72vh;
      width: 100%;
      background: #000;
      justify-self: center;
    }
    .error-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes crt-off {
      0%   { transform: scaleY(1)    scaleX(1);    filter: brightness(1); }
      35%  { transform: scaleY(0.03) scaleX(1);    filter: brightness(4); }
      62%  { transform: scaleY(0.03) scaleX(0.07); filter: brightness(2); }
      85%  { transform: scaleY(0.06) scaleX(0.06); filter: brightness(3); }
      100% { transform: scaleY(0.06) scaleX(0.06); filter: brightness(2); }
    }
    @keyframes crt-on {
      0%   { transform: scaleY(0.06) scaleX(0.06); filter: brightness(4); }
      30%  { transform: scaleY(0.03) scaleX(1);    filter: brightness(3); }
      65%  { transform: scaleY(1.05) scaleX(1);    filter: brightness(1.5); }
      100% { transform: scaleY(1)    scaleX(1);    filter: brightness(1); }
    }
    #signal-404-wrap { transform-origin: center center; }

    @media (max-width: 860px) {
      .error-hero {
        padding: 90px 24px 40px;
      }
      .error-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .error-text {
        padding-top: 8px;
      }
      .error-text .hero-sub {
        padding-bottom: 0;
      }
      .error-video-wrap {
        max-height: 60vw;
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursorFollower"></div>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav-logo" aria-label="Juan Gomez Vara">
      <img class="logo-img" src="assets/logo-dark.svg" alt="JGV" width="44" height="44" />
      <span class="nav-name">Juan Gomez Vara</span>
    </a>
    <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu" aria-expanded="false">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html#work" class="nav-link magnetic"><span>Projects</span></a>
        <a href="index.html#about" class="nav-link magnetic"><span>About</span></a>
      </div>
      <a href="index.html#footer" class="btn-nav magnetic">
        <span class="btn-text">Contact</span>
        <span class="btn-arrow">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M4 9l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <nav class="mobile-menu-links">
      <a href="index.html#work" class="mobile-nav-link">Projects</a>
      <a href="index.html#about" class="mobile-nav-link">About</a>
      <a href="index.html#footer" class="mobile-nav-link">Contact</a>
    </nav>
  </div>

  <!-- 404 Section — .hero class triggers load-based animation in script.js -->
  <section class="hero error-hero" id="hero">
    <canvas class="dot-grid-canvas" id="dotGrid"></canvas>
    <div class="hero-noise"></div>

    <div class="error-grid">

      <!-- Left: text -->
      <div class="hero-content error-text">
        <h1 class="hero-title">
          <div class="hero-line" data-animate="reveal" data-delay="100">
            <span>Oops, the Wifi</span>
          </div>
          <div class="hero-line" data-animate="reveal" data-delay="250">
            <span>is <span class="gradient-word">gone.</span></span>
          </div>
        </h1>

        <p class="hero-sub" data-animate="fade-up" data-delay="450">
          <span class="type-tag">&lt;p&gt;</span><span id="errorTypewriter"></span><span class="type-cursor" id="errorTypeCursor"></span><span class="type-tag type-tag--close" id="errorTypeClose"></span>
        </p>

      </div>

      <!-- Right: video -->
      <div id="signal-404-wrap" class="error-video-wrap" data-animate="fade-up" data-delay="200">
        <video id="signal-404" class="error-video" autoplay muted playsinline>
          <source src="assets/juan-signal.mp4" type="video/mp4" />
        </video>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
  <script>
    window.addEventListener('load', () => {
      const typeEl     = document.getElementById('errorTypewriter');
      const typeCursor = document.getElementById('errorTypeCursor');
      const typeClose  = document.getElementById('errorTypeClose');
      if (!typeEl) return;

      const fullText = 'A 404 is here. Stay until the connection comes back.';
      let idx = 0;

      function typeNext() {
        if (idx >= fullText.length) {
          typeCursor.classList.add('done');
          typeClose.textContent = '</p>';
          typeClose.classList.add('visible');
          return;
        }
        typeEl.textContent += fullText[idx];
        idx++;
        setTimeout(typeNext, 26 + Math.random() * 20);
      }

      setTimeout(typeNext, 1450);
    });
  </script>
  <script>
    (function () {
      var wrap = document.getElementById('signal-404-wrap');
      var vid  = document.getElementById('signal-404');

      function enterDot() {
        wrap.style.animation = '';
        wrap.style.transform = '';
        wrap.style.filter    = '';
        vid.style.visibility = 'hidden';
        wrap.style.borderRadius = '50%';
        wrap.style.background   = 'rgba(255,255,255,0.85)';
        wrap.style.boxShadow    = '0 0 16px 6px rgba(255,255,255,0.4)';
        setTimeout(exitDot, 600);
      }

      function exitDot() {
        vid.currentTime         = 0;
        wrap.style.borderRadius = '20px';
        wrap.style.background   = '#000';
        wrap.style.boxShadow    = '';
        vid.style.visibility    = '';
        wrap.style.animation    = 'crt-on 0.55s ease-out forwards';
        wrap.addEventListener('animationend', function () {
          wrap.style.animation = '';
          wrap.style.transform = '';
          wrap.style.filter    = '';
          vid.play();
        }, { once: true });
      }

      vid.addEventListener('ended', function () {
        wrap.style.animation = 'crt-off 0.65s ease-in forwards';
        wrap.addEventListener('animationend', enterDot, { once: true });
      });
    })();
  </script>

</body>
</html>
